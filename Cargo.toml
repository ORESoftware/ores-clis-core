[package]
name = "ores-clis-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Shared terminal, color, log-level, structured-output, and streaming policy for ORESoftware Rust CLIs"
repository = "https://github.com/ORESoftware/ores-clis-core"
readme = "README.md"
keywords = ["cli", "terminal", "logging", "json", "opentelemetry"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ores_clis_core"
path = "src/root.rs"

[dependencies]
flate2 = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
self-replace = "1.5"
tar = "0.4"
tempfile = "3"
ureq = { version = "2.12", features = ["json", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
