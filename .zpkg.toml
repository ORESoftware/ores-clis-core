[package]
org = "oresoftware"
name = "ores-clis-core"
version = "0.1.1"
description = "Shared Rust CLI runtime policy for terminal-aware output, signals, log levels, and streaming"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-clis-core"

# Zed's package manifest is the package/install authority. Ambient process
# variables consumed by the SDK are documented in README.md and
# docs/runtime-semantics.md because the current Zed manifest schema does not
# define arbitrary environment-variable inventory entries.

# Zed-level runtime/build package dependencies belong here. Rust crate
# dependencies (serde_json plus target-specific signal support) remain declared
# in Cargo.toml. ORESoftware/ores-interfaces provides cross-repo authority
# lineage and typespec-json-schema-validator provides admission; both remain
# exact-pinned CI/contract tooling rather than install-time SDK edges.
[dependencies]

[install]
dir = ".vendor/.zed"

# This is a shared source SDK, not a prebuilt binary/rlib bundle. Consumers use
# Cargo path+version dependencies against the Zed-materialized crate tree.
[targets.rust]
dir = "."
adapter = "rust"

[targets.contracts]
dir = "contracts"
adapter = "none"

[targets.conformance]
dir = "conformance"
adapter = "none"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo check --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --lib"
exclude = [
  "target/**",
  ".vendor/.zed/**",
  ".typespec-json-schema-validator/**",
  ".contract/**",
  "tmp/**",
  "**/*.log",
]

# Zed is the source-SDK package authority for this whole-repository Rust target.
# Native crates.io publication is intentionally a separate concern and must not
# be encoded as a target/root native route here.

[scripts]
test = "sh conformance/check.sh && cargo test --all-targets && tjsv check --typespec=contracts/cli-runtime/v1/main.tsp --schema=contracts/cli-runtime/v1/authored.schema.json --report=.typespec-json-schema-validator/cli-runtime-v1/report.json"
conformance = "sh conformance/check.sh"
