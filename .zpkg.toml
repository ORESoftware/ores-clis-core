[package]
org = "oresoftware"
name = "ores-clis-core"
version = "0.1.0"
description = "Shared Rust CLI runtime policy for terminal-aware output, color, log levels, and streaming"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-clis-core"

# Runtime/build package dependencies belong here. The crate itself only links
# serde_json through Cargo. ORESoftware/ores-interfaces provides cross-repo
# authority lineage and typespec-json-schema-validator provides admission; both
# remain exact-pinned CI/contract tooling rather than install-time SDK edges.
[dependencies]

[build]
command = "cargo build --release"
outputs = ["target/release/libores_clis_core.rlib", "contracts"]

[install]
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo check --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --lib"
exclude = [
  "target/**",
  ".vendor/.zed/**",
  ".typespec-json-schema-validator/**",
  ".contract/**",
  "tmp/**",
  "**/*.log",
]

[publish.native]
registry = "crates-io"
package = "ores-clis-core"

[scripts]
test = "cargo test --all-targets && tjsv check --typespec=contracts/cli-runtime/v1/main.tsp --schema=contracts/cli-runtime/v1/authored.schema.json --report=.typespec-json-schema-validator/cli-runtime-v1/report.json"
