name: ores-clis-core admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-clis-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact reviewed head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add --toolchain 1.88.0 rustfmt clippy

      - name: Format
        shell: bash
        run: cargo +1.88.0 fmt --all --check

      - name: Clippy
        shell: bash
        run: cargo +1.88.0 clippy --all-targets --all-features -- -D warnings

      - name: Test
        shell: bash
        run: cargo +1.88.0 test --all-targets --all-features

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact reviewed head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@1bece480626c6db52c0a9ecbe65be0ceb1172e20
        with:
          typespec: contracts/cli-runtime/v1/main.tsp
          schema: contracts/cli-runtime/v1/authored.schema.json
          instances: contracts/cli-runtime/v1/instances
          report: .contract/tjsv-report.json
          contract_ir: .contract/tjsv-contract-ir.json
          output_dir: .contract/generated
          quiet: 'false'

      - name: Prove authored authorities stayed read-only
        run: |
          git diff --exit-code -- \
            contracts/cli-runtime/v1/main.tsp \
            contracts/cli-runtime/v1/authored.schema.json

  package:
    name: zed-package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact reviewed head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install released Zed package manager
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/zed.tar.gz" \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.2.3/zed-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            b8f81a8e4943cbaeb47153386819a911dcf02666a8709c5bd013e4f35b1ba1b9 \
            "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate package metadata
        run: zed validate

      - name: Pack exact candidate artifact
        env:
          ZED_PACK_OUT: ${{ runner.temp }}/ores-clis-core-zed
        run: |
          set -euo pipefail
          zed pack --out "$ZED_PACK_OUT"
          test "$(find "$ZED_PACK_OUT" -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1

      - name: Inspect artifact allowlist and denylist
        env:
          ZED_PACK_OUT: ${{ runner.temp }}/ores-clis-core-zed
        run: |
          set -euo pipefail
          archive="$(find "$ZED_PACK_OUT" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          tar -tzf "$archive" > "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'pkg/.zpkg.toml' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'pkg/Cargo.toml' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'pkg/src/root.rs' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'pkg/contracts/cli-runtime/v1/main.tsp' "$RUNNER_TEMP/package-files.txt"
          grep -Fx 'pkg/contracts/cli-runtime/v1/authored.schema.json' "$RUNNER_TEMP/package-files.txt"
          if grep -E '(^|/)(\.github|target|tmp|\.contract|\.typespec-json-schema-validator)(/|$)|\.log$' "$RUNNER_TEMP/package-files.txt"; then
            echo 'forbidden build, CI, or scratch material leaked into package' >&2
            exit 1
          fi

      - name: Build unpacked artifact as a clean crate
        env:
          ZED_PACK_OUT: ${{ runner.temp }}/ores-clis-core-zed
        run: |
          set -euo pipefail
          archive="$(find "$ZED_PACK_OUT" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          consumer="$(mktemp -d)"
          tar -xzf "$archive" -C "$consumer"
          cargo check --manifest-path "$consumer/pkg/Cargo.toml" --lib

      - name: Roundtrip artifact through Zed consumer smoke
        run: zed r2g

      - name: Upload admitted candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-clis-core-zed-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ores-clis-core-zed/*.tar.gz
          if-no-files-found: error
          retention-days: 30
