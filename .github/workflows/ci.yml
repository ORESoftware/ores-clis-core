name: cli-runtime-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'
      - run: npm install --no-save @oresoftware/typespec-json-schema-validator
      - run: >-
          npx tjsv check
          --typespec=contracts/cli-runtime/v1/main.tsp
          --schema=contracts/cli-runtime/v1/authored.schema.json
          --report=.typespec-json-schema-validator/cli-runtime-v1/report.json
