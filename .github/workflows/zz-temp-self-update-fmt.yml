name: temporary self-update formatter

on:
  push:
    branches:
      - feat/shared-self-update

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-self-update
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup component add --toolchain 1.88.0 rustfmt
      - run: cargo +1.88.0 fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email 'alexander.d.mills@gmail.com'
          git add --all
          git commit -m 'style: apply rustfmt to self-update runtime'
          git push origin HEAD:feat/shared-self-update
