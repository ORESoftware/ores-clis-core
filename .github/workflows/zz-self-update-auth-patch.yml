name: temporary self-update auth patch

on:
  push:
    branches:
      - fix/self-update-gh-auth-fallback
    paths:
      - '.github/workflows/zz-self-update-auth-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Patch updater auth fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/self_update.rs')
          text = path.read_text()

          old = '''fn github_token() -> Option<String> {
              return env::var("GITHUB_TOKEN")
                  .ok()
                  .filter(|value| !value.trim().is_empty())
                  .or_else(|| {
                      env::var("GH_TOKEN")
                          .ok()
                          .filter(|value| !value.trim().is_empty())
                  });
          }
          '''

          new = '''fn github_token() -> Option<String> {
              if let Some(token) = env::var("GITHUB_TOKEN")
                  .ok()
                  .filter(|value| !value.trim().is_empty())
                  .or_else(|| {
                      env::var("GH_TOKEN")
                          .ok()
                          .filter(|value| !value.trim().is_empty())
                  })
              {
                  return Some(token);
              }

              return github_cli_token();
          }

          fn github_cli_token() -> Option<String> {
              let output = Command::new("gh")
                  .args(["auth", "token"])
                  .stdin(Stdio::null())
                  .stderr(Stdio::null())
                  .output()
                  .ok()?;
              if !output.status.success() {
                  return None;
              }

              let token = String::from_utf8(output.stdout).ok()?;
              let token = token.trim();
              if token.is_empty() {
                  return None;
              }

              return Some(token.to_owned());
          }
          '''

          if old not in text:
              raise SystemExit('expected github_token implementation not found')

          text = text.replace(old, new, 1)
          old_help = '    println!("  GITHUB_TOKEN / GH_TOKEN   Token used for private GitHub release access");'
          new_help = old_help + '\n    println!("  gh auth token              Used automatically when env tokens are unset");'
          if old_help not in text:
              raise SystemExit('expected self-update help text not found')
          text = text.replace(old_help, new_help, 1)
          path.write_text(text)
          PY

      - name: Format and test exact patch
        run: |
          cargo fmt --all -- --check
          cargo test self_update

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/self_update.rs
          git commit -m 'fix: use gh auth token for private self-update releases'
          git push origin HEAD:fix/self-update-gh-auth-fallback
